schema_version: 1

context:
  version: "5.2.0"

package:
  name: social-auth-core
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/social-auth-core/social_auth_core-${{ version }}.tar.gz
  sha256: 72d3c52fe87d07c0db8421fee5f5ec33b3dacce449975b8a572cd0691e3de315

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=78.0.2
    - pip
  run:
    - python >=${{ python_min }}
    - cryptography >=46.0.7
    - defusedxml >=0.7.1
    - oauthlib >=3.3.1
    - pyjwt >=2.13.0
    - python3-openid >=3.2.0
    - requests-oauthlib >=2.0.0
    - requests >=2.34.0

tests:
  - python:
      imports:
        - social_core
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python social authentication made simple.
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/python-social-auth/social-core

extra:
  recipe-maintainers:
    - ocefpaf
